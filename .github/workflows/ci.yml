name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:firefox -w apps/extension
      - run: npm run check:network
      - run: npm run check:seo
