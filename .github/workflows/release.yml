name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: npm test
      - run: npm run zip -w apps/extension
      - run: npm run zip:firefox -w apps/extension
      - run: npm run check:network
      - name: Generate SHA256 checksums
        run: cd apps/extension/.output && sha256sum *.zip *.xpi > SHA256SUMS.txt
      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/extension/.output/*.zip
            apps/extension/.output/*.xpi
            apps/extension/.output/SHA256SUMS.txt
