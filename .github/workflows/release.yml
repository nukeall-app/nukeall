name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:licenses
      - run: npm run typecheck
      - run: npm test
      - run: npm run zip -w apps/extension
      - run: npm run zip:firefox -w apps/extension
      - run: npm run lint:firefox -w apps/extension
      - run: npm run check:network
      - run: npm run package:release
      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            apps/extension/.output/release/nukeall-chrome.zip
            apps/extension/.output/release/nukeall-firefox.zip
            apps/extension/.output/release/nukeall-sources.zip
            apps/extension/.output/release/SHA256SUMS.txt
