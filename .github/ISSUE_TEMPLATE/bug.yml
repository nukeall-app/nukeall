name: Bug report
description: Report a problem with NukeAll
labels: ["bug"]
body:
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox
        - Chrome
        - Edge
        - Brave
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Do not paste personal tweets, cookies or session tokens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
